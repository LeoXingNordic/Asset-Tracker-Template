# Debug overlay for boot loops on Thingy:91 X. Add after overlay-ntn-myriota-thingy91x.conf.
# Shows TF-M and non-secure fault information on UART0 and stops at the fault instead of resetting.

CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_ASSERT=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_MODE_DEFERRED=n

CONFIG_TFM_SECURE_UART0=y
CONFIG_TFM_SPM_LOG_LEVEL_DEBUG=y
CONFIG_TFM_LOG_LEVEL_SILENCE=n
CONFIG_TFM_EXCEPTION_INFO_DUMP=y
CONFIG_TFM_ALLOW_NON_SECURE_FAULT_HANDLING=y
