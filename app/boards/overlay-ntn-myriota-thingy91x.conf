# Board overlay for Myriota NTN builds on Thingy:91 X. Use instead of
# boards/overlay-ntn-myriota.conf (which is for the nRF9151 DK).
# MCUboot stays enabled (factory bootloader layout) and uses the external SPI NOR flash
# as secondary slot, so SPI/SPI_NOR must stay on.

CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y
CONFIG_PWM=y

# Wi-Fi needs the native network stack, which HyperPulse socket offload replaces.
# (SB_CONFIG_WIFI_NRF70=n in sysbuild.conf stops sysbuild from forcing it on.)
CONFIG_WIFI=n

# MCUboot image manager (set by prj.conf, but not by prj-ntn-myriota.conf).
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# Demo features: fuel gauge (nPM1300) and RGB LED status
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NPM13XX_CHARGER=y
CONFIG_APP_POWER=y
CONFIG_APP_POWER_LOG_LEVEL_DBG=y
CONFIG_APP_LED=y
CONFIG_APP_LED_LOG_LEVEL_DBG=y

# Same as prj.conf: devices on the Thingy:91 X sit behind PMIC-controlled power domains.
CONFIG_PM_DEVICE=y

# TF-M logging on the shared UART0. A silent TF-M (no secure UART) boot-loops on this board.
CONFIG_TFM_SECURE_UART0=y
CONFIG_TFM_LOG_LEVEL_SILENCE=n
CONFIG_TFM_SPM_LOG_LEVEL_ERROR=y
CONFIG_TFM_EXCEPTION_INFO_DUMP=y
