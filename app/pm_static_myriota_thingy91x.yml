#
# Thingy:91 X (nRF9151 NS) variant of pm_static_myriota.yml: the factory bootloader
# layout (b0/s0/s1/MCUboot, external-flash secondary slot) with the application slot
# shortened to make room for the HyperPulse network_info storage at 0xcc000.
# Derived from nrf/boards/nordic/thingy91x/thingy91x_nrf9151_pm_static.yml.

b0:
  address: 0x0
  size: 0x8000
  region: flash_primary
b0_container:
  address: 0x0
  size: 0x8000
  region: flash_primary
  span: [b0]
s0:
  address: 0x8000
  size: 0x14000
  span: [mcuboot, s0_pad]
  region: flash_primary
s0_pad:
  address: 0x8000
  size: 0x200
  share_size: [mcuboot_pad]
  region: flash_primary
s0_image:
  address: 0x8200
  size: 0x13e00
  span: [mcuboot]
  region: flash_primary
mcuboot:
  address: 0x8200
  size: 0x13e00
  region: flash_primary
s1:
  address: 0x1c000
  size: 0x14000
  span: [s1_pad, s1_image]
  region: flash_primary
s1_pad:
  address: 0x1c000
  size: 0x200
  region: flash_primary
  share_size: [mcuboot_pad]
s1_image:
  address: 0x1c200
  size: 0x13e00
  share_size: [mcuboot]
  region: flash_primary
mcuboot_primary:
  address: 0x30000
  size: 0x9c000
  span: [mcuboot_pad, app, tfm]
  region: flash_primary
tfm_secure:
  address: 0x30000
  size: 0x8000
  span: [mcuboot_pad, tfm]
  region: flash_primary
mcuboot_pad:
  address: 0x30000
  size: 0x200
  region: flash_primary
mcuboot_primary_app:
  address: 0x30200
  size: 0x9be00
  span: [tfm, app]
  region: flash_primary
app_image:
  address: 0x30200
  size: 0x9be00
  span: [tfm, app]
  region: flash_primary
tfm:
  address: 0x30200
  size: 0x7e00
  region: flash_primary
tfm_nonsecure:
  address: 0x38000
  size: 0x94000
  span: [app]
  region: flash_primary
app:
  address: 0x38000
  size: 0x94000
  region: flash_primary

mcuboot_secondary:
  device: DT_CHOSEN(nordic_pm_ext_flash)
  address: 0x0
  size: 0x9c000
  share_size: [mcuboot_primary]
  region: external_flash
fmfu_storage:
  address: 0x9c000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  region: external_flash
  size: 0x400000
settings_storage:
  device: DT_CHOSEN(nordic_pm_ext_flash)
  address: 0x49c000
  size: 0x2000
  region: external_flash

nonsecure_storage:
  address: 0xcc000
  size: 0x34000
  region: flash_primary
  span: [hyperpulse_storage_network, hyperpulse_storage_platform]

hyperpulse_storage_network:
  address: 0xcc000
  size: 0x30000
  region: flash_primary
  inside: [nonsecure_storage]

hyperpulse_storage_platform:
  address: 0xfc000
  size: 0x4000
  region: flash_primary
  inside: [nonsecure_storage]
